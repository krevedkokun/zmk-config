# Applied on top of totem.conf, which ZMK also picks up for this shield
# (candidate names for `totem_dongle` reduce to the shield dir name `totem`).

CONFIG_ZMK_SLEEP=n
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=70
CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# --- TEMPORARY DIAGNOSTICS: remove once split pairing is confirmed ---
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_BT_LOG_LEVEL_INF=y
